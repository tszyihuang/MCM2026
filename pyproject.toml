[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcm2026-b"
version = "1.0.0"
description = "2026 高教社杯 B 题: 无线电干扰源环境模拟器与机器狗程序"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# 模拟器、部署程序与全部测试/工具只依赖标准库; 只有求解器的进程内评测
# (robotdog.solver) 需要 numpy。见 optional-dependencies.solver。
dependencies = []

[project.optional-dependencies]
solver = ["numpy>=1.24"]

[project.scripts]
robotdog = "robotdog.solver.deploy:main"

[tool.setuptools]
packages = ["simulator", "robotdog", "robotdog.solver", "tools", "tools.probes"]

[tool.pytest.ini_options]
# 仓库根目录必须在 sys.path 上, 各模块才能 import simulator / robotdog。
pythonpath = ["."]
